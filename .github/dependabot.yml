# Version updates (ADR 12, M0 plan D11). Every bump is a pull request that CI and the
# author check like any other. The cooldown is set explicitly rather than left to
# GitHub's default, so a change to that default can't shorten it; security updates
# skip it. The commit-message settings make subjects such as
# "build(deps): bump Npgsql from 10.0.3 to 10.0.4", which the commit-format check
# accepts for Dependabot (docs/conventions.md#dependabot).

version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci
      include: scope
