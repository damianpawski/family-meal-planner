# CI (M0 plan, task 3). Runs on every pull request and on every push to main.
# Actions are pinned by commit id, with the release in a comment.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request makes its older run pointless, so it cancels it.
# Each run on main gets a group of its own, because GitHub also drops a run that is still
# waiting in a group when a newer one joins it: every commit that lands on main gets a
# finished run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history and its tags: MinVer reads the version from them (task 7).
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # GitHub sets CI=true, which also turns on RestoreLockedMode (Directory.Build.props):
      # a lock file that doesn't match the projects fails here, before anything is built.
      - name: Restore in locked mode
        run: dotnet restore MealPlanner.slnx --locked-mode

      # ADR 12's lists: the app's for every project under src/, the test list (which also
      # allows MPL-2.0) for the whole solution. The script says how.
      - name: Check licences
        shell: pwsh
        run: ./.github/scripts/check-licences.ps1

      - name: Build
        run: dotnet build MealPlanner.slnx --configuration Release --no-restore

      # Unit and integration tests. The integration tests start Postgres with
      # Testcontainers, on the runner's Docker.
      - name: Test
        run: dotnet test --solution MealPlanner.slnx --configuration Release --no-build

  fixed-checks:
    name: Push review fixed checks
    # The checks read a pull request's own commits. Once they're on main, GitHub has
    # rewritten their committer and ids (docs/review/push-review.md, Part 4).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request's own commits, not the merge commit GitHub makes for it.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # The gitleaks release the hook's fixed checks were tested with, checked against
      # the hash published with it.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      # F1, F2, F4, F5 and F6 on every commit in the pull request; F3's list exists only
      # on the author's machine. The commits are counted from the base branch as just
      # fetched, not from the event's base commit, which can be older: a branch rebased
      # onto a newer main must not bring main's own commits, whose committer GitHub
      # rewrote, back into the check. The expected email is the repository owner's
      # noreply address, built from the owner's id and name, so no address is written here.
      - name: Run the fixed checks
        shell: pwsh
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_EMAIL: ${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com
        run: ./.githooks/push-review.ps1 -Range "origin/$env:BASE_REF..$env:HEAD_SHA" -Ci -ExpectedEmail $env:EXPECTED_EMAIL

  push-review-tests:
    name: Push review tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PESTER_VERSION: 6.2.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The PowerShell Gallery has no lock file, so the version is pinned here.
      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -RequiredVersion $env:PESTER_VERSION -Scope CurrentUser -Force -Repository PSGallery

      - name: Test the hook's own code
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion $env:PESTER_VERSION
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = 'tests/PushReview'
          $configuration.Run.Exit = $true
          $configuration.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $configuration
